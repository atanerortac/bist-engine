name: Daily BIST Pipeline

on:
  schedule:
    # Full sync every 4h: 08:00, 12:00, 16:00, 20:00 Istanbul (UTC+3)
    - cron: '0 5,9,13,17 * * 1-5'
    # Light sync every 4h offset: 10:00, 14:00, 18:00 Istanbul (UTC+3)
    - cron: '0 7,11,15 * * 1-5'
  workflow_dispatch:  # allow manual trigger from GitHub UI or Supabase Edge Function

concurrency:
  group: bist-pipeline
  cancel-in-progress: false  # queue second trigger; don't cancel a running pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: bist_ajan.db
          key: bist-db-${{ runner.os }}
          restore-keys: |
            bist-db-

      - name: Run BIST pipeline
        run: python main.py --auto
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Sync to Supabase
        run: |
          if [ "${{ github.event.schedule }}" = "0 5,9,13,17 * * 1-5" ]; then
            python supabase_sync.py --full
          else
            python supabase_sync.py --light
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Save database cache
        uses: actions/cache@v4
        with:
          path: bist_ajan.db
          key: bist-db-${{ runner.os }}
