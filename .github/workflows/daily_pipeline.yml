name: Daily BIST Pipeline

on:
  schedule:
    # 05:30 UTC = 08:30 Turkey (UTC+3), morning pre-market
    - cron: '30 5 * * 1-5'
    # 17:00 UTC = 20:00 Turkey (UTC+3), evening post-market close
    - cron: '0 17 * * 1-5'
  workflow_dispatch:  # allow manual trigger from GitHub UI or Supabase Edge Function

concurrency:
  group: bist-pipeline
  cancel-in-progress: false  # queue second trigger; don't cancel a running pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: bist_ajan.db
          key: bist-db-${{ runner.os }}
          restore-keys: |
            bist-db-

      - name: Run BIST pipeline
        run: python main.py --auto
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Sync to Supabase
        run: python supabase_sync.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Save database cache
        uses: actions/cache@v4
        with:
          path: bist_ajan.db
          key: bist-db-${{ runner.os }}
